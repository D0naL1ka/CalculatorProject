name: CI Pipeline

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, review_requested, submitted]
    branches:
      - develop

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4.2.3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        run: mvn clean compile -B

      - name: Run tests and generate JaCoCo report
        run: mvn test -B

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4.6.2
        with:
          name: jacoco-report
          path: target/site/jacoco/

  analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4.2.3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Rebuild for analysis
        run: mvn clean test -B -q

      - name: Code Review Check for develop
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            console.log(`Перевірка PR #${prNumber}...`);

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: prNumber
            });

            console.log(`Знайдено рев'ю: ${reviews.length}`);
            reviews.forEach(r => {
              console.log(`  - ${r.user.login}: ${r.state} (${r.submitted_at})`);
            });

            const approved = reviews.some(r => r.state === 'APPROVED');

            if (!approved) {
              core.setFailed("Помилка: Код-рев'ю не схвалено. Потрібне щонайменше одне рев'ю зі статусом APPROVED.");
            } else {
              console.log("OK: Знайдено схвалене рев'ю. Пайплайн продовжується.");
            }

      - name: Count lines of code with Cloc
        run: |
          sudo apt-get install -y cloc -q
          cloc src/main/java --out=cloc-report.txt
          echo '=== Cloc Report ===' && cat cloc-report.txt

      - name: Upload Cloc report
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cloc-report
          path: cloc-report.txt

      - name: Start SonarQube
        run: |
          docker run -d --name sonarqube \
            -p 9000:9000 \
            sonarqube:community
          echo "Waiting for SonarQube to start..."
          for i in {1..30}; do
            if curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              echo "SonarQube is up!"
              break
            fi
            echo "Attempt $i: not ready yet, waiting 10s..."
            sleep 10
          done

      - name: Create SonarQube project and get token
        run: |
          curl -s -u admin:admin -X POST \
            "http://localhost:9000/api/projects/create?name=CalculatorProject&project=CalculatorProject"
          TOKEN=$(curl -s -u admin:admin -X POST \
            "http://localhost:9000/api/user_tokens/generate?name=ci-token" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Run SonarQube analysis
        run: |
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -q sonar-scanner-cli-5.0.1.3006-linux.zip
          export PATH=$PATH:$(pwd)/sonar-scanner-5.0.1.3006-linux/bin
          sonar-scanner \
            -Dsonar.projectKey=CalculatorProject \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=$SONAR_TOKEN
            - name: Run Checkstyle and generate report
        
        run: mvn checkstyle:check -q || true

      - name: Upload Checkstyle report
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml

      - name: Install Reviewdog
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Reviewdog with Checkstyle
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn checkstyle:checkstyle -q || true
          cat target/checkstyle-result.xml \
            | reviewdog -f=checkstyle \
                        -reporter=github-pr-review \
                        -level=warning \
                        -filter-mode=added